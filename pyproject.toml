[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "s20-pipeline"
version = "0.1.0"
readme = "README.md"
description = "Native S20 reconstruction and visibility-consensus photo color"
requires-python = ">=3.11,<3.14"
dependencies = ["numpy==2.4.6", "scipy==1.17.1", "Pillow==12.3.0", "laspy==2.7.0", "rosbags==0.11.5", "PyYAML==6.0.3", "psutil==7.2.2"]

[project.optional-dependencies]
masks = ["torch==2.14.0", "torchvision==0.29.0"]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[project.scripts]
s20 = "s20_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
