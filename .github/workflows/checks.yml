name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src tests tools
      - run: ruff format --check src tests tools
      - run: pytest -q
  native:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: s20 build --jobs 3
      # Hosted runners may not expose a Metal device. Physical-Mac validation is separate.
      - run: S20_SKIP_GPU_TESTS=1 pytest -q
